name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for testing! Please don't attach vault files, databases, keys or atelier_config.json."
  - type: input
    id: version
    attributes:
      label: Atelier version
      description: Shown under the title in the header, e.g. v2.9.5
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options: [Main window, SolidCraft panel, PhysCAD panel, CAM & Tools, Installer / setup wizard, Server, Other]
  - type: textarea
    id: steps
    attributes:
      label: What did you do, and what happened?
      description: Steps to make it happen again, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: Contents of %LOCALAPPDATA%\Atelier PDM\atelier_error.log (remove anything private)
      render: text
