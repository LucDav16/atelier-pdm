[package]
name = "atelier-pdm-solidcraft"
version = "0.1.0"
edition = "2021"
description = "Atelier PDM commands inside SolidCraft (writes requests that Atelier PDM carries out)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
